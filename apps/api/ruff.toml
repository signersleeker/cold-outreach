line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI Depends() in defaults is the documented idiom

[lint.per-file-ignores]
"tests/*" = ["E501"]
# Holds the email template bodies verbatim. Reflowing them would change what
# goes out on the wire, so long lines stay.
"app/templates/constants.py" = ["E501"]
